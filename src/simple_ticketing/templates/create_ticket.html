{% extends "base.html" %}

{% block content %}
<h2>Create tickets</h2>

<div class="form-container">
    <form id="create-ticket-form">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter Name" required>

        <label for="email">EMail:</label>
        <input type="email" id="email" name="email" placeholder="Enter E-Mail" required>

        <label for="count">Count:</label>
        <input type="number" id="count" name="count" value="1" min="1" max="10" required>

        <label for="seat_type">Seat type:</label>
        <select id="seat_type" name="seat_type"></select>

        <button type="submit">Submit</button>
    </form>

    <div id="response-message" class="message"></div>
</div>

<script src="{{ url_for('static', filename='js/create_ticket_form.js') }}"></script>
{% endblock %}
